name: Review Readiness

on:
  pull_request:
  workflow_dispatch:

jobs:
  relay-review-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Relay review readiness
        run: |
          BASE_REF="origin/${GITHUB_BASE_REF:-main}"
          python3 plugins/relay-codex/scripts/relay_runtime.py review-readiness --base-ref "$BASE_REF" --json | tee relay-review-readiness.json

      - name: Generate Relay validation bundle
        run: |
          BASE_REF="origin/${GITHUB_BASE_REF:-main}"
          python3 plugins/relay-codex/scripts/relay_runtime.py validation-brief --base-ref "$BASE_REF" --json | tee relay-validation-brief.json

      - name: Publish Relay review readiness summary
        if: always()
        run: |
          if [ -f .relay/review-readiness.md ]; then
            cat .relay/review-readiness.md >> "$GITHUB_STEP_SUMMARY"
            {
              echo
              echo "## Relay Validation Bundle"
              echo
              echo "The workflow uploaded a validation bundle with:"
              echo
              echo "- .relay/review-readiness.md"
              echo "- .relay/handoff.md"
              echo "- .relay/pr-comment.md"
              echo "- .relay/reviewer-pack.md"
              echo "- .relay/validation-brief.md"
              echo "- relay-review-readiness.json"
              echo "- relay-validation-brief.json"
              echo
              echo "Use the bundle when asking an outside maintainer to compare Relay output with a normal Codex/manual summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Relay Review Readiness"
              echo
              echo "Relay did not generate .relay/review-readiness.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Relay review readiness artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-review-readiness
          path: |
            .relay/review-readiness.md
            relay-review-readiness.json
          if-no-files-found: warn

      - name: Upload Relay validation bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-validation-bundle
          path: |
            .relay/review-readiness.md
            .relay/handoff.md
            .relay/pr-comment.md
            .relay/reviewer-pack.md
            .relay/validation-brief.md
            relay-review-readiness.json
            relay-validation-brief.json
          if-no-files-found: warn
