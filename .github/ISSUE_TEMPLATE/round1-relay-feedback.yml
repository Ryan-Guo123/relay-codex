name: Round 1 Relay feedback
description: Record whether the Round 1 Relay handoff was useful to an outside reviewer.
title: "Round 1 feedback: "
labels:
  - validation
  - feedback
  - round-1
  - needs-ledger-update
body:
  - type: markdown
    attributes:
      value: |
        Use this form after judging one Round 1 artifact.

        60-second quick verdict:
        https://github.com/Ryan-Guo123/relay-codex/blob/main/docs/reviewer-quick-verdict.md

        Full Round 1 reviewer request:
        https://github.com/Ryan-Guo123/relay-codex/blob/main/docs/round1-reviewer-request.md

        Pick the matching review path below so quick verdicts, reviewer packets, real PR handoffs, and external repo trials stay separate in the evidence ledger.

        Please be blunt. `ignored` and `confusing` are useful outcomes.
  - type: dropdown
    id: review_path
    attributes:
      label: Review path
      description: Which Relay artifact or trial did you judge?
      options:
        - 60-second quick verdict
        - Round 1 reviewer request
        - Reviewer pack example
        - External repo trial
        - Real PR handoff
        - Other
    validations:
      required: true
  - type: dropdown
    id: reviewer_relationship
    attributes:
      label: Reviewer relationship
      description: Pick the closest description.
      options:
        - Outside maintainer
        - Outside contributor
        - Frequent PR reviewer
        - Teammate who did not run Codex
        - User evaluating Relay
        - Other
    validations:
      required: true
  - type: dropdown
    id: ai_review_fit
    attributes:
      label: Fit with AI PR review tools
      description: Would Relay be useful alongside tools like Copilot code review, CodeRabbit, Graphite, Qodo, or PR-Agent?
      options:
        - in_addition
        - before_review
        - instead
        - not_needed
        - unsure
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      description: What would you do with the Relay handoff?
      options:
        - reused
        - edited_heavily
        - ignored
        - confusing
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: Relay vs normal PR summary
      description: Was the Relay handoff better, worse, or different from the normal PR summary in the reviewer request or quick verdict page? If you use an AI PR review tool, say whether it already covers this job.
      placeholder: "Relay helped with changed files, but the normal summary was easier to paste..."
    validations:
      required: true
  - type: textarea
    id: rubric
    attributes:
      label: Rubric scores
      description: Score each item from 1 to 5 and add short notes where useful.
      value: |
        - Changed files:
        - Verification:
        - Review focus:
        - Review readiness signal:
        - Next action:
        - GitHub fit:
    validations:
      required: true
  - type: textarea
    id: missing_or_noisy
    attributes:
      label: What was missing or noisy?
      description: Name anything that should be removed, shortened, or added before Relay asks another reviewer.
      placeholder: "The verification section was too thin; the sensitive-path warning was useful..."
    validations:
      required: true
  - type: textarea
    id: product_decision
    attributes:
      label: Product decision
      description: What should Relay do next based on your feedback?
      placeholder: "Keep the review-readiness gate, simplify the PR handoff, test again on a larger PR..."
    validations:
      required: true
